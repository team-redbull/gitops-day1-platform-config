# e2e test cluster for the allocate-segment workflow — SAFE TO DELETE.
#
# Deliberately carries NO dhcp_values: that is the pre-allocation state the
# workflow finds, appends its marker block to, and pushes. The one key below
# exists because the hcAppset git files generator fails on an empty file; the
# hostedclusters-setup chart ignores it.
e2eTest: true

# === Added By Segment-Allocation Workflow ===
vlanId: 200

dhcp_values:
  network: "192.10.99.0"
  startRange: "192.10.99.11"
  endRange: "192.10.99.240"

  exclusions:
    - startAddress: "192.10.99.1"
      endAddress: "192.10.99.10"
    - startAddress: "192.10.99.241"
      endAddress: "192.10.99.254"
