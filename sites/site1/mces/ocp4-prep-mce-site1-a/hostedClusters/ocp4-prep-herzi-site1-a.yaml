dhcp_values:
  # The minimal cluster file: a subnet, and nothing else.
  #
  # scopeName derives from this file's name. subnetMask derives 255.255.255.0,
  # gateway derives .254, and startRange/endRange derive .1-.253 — one address short
  # of the gateway on purpose, so the two defaults cannot collide.
  #
  # leaseDurationDays and dns.servers come from sites/configValues.yaml, and the
  # failover block with them; relationshipName derives <scopeName>-failover.
  network: "10.20.40.0"

