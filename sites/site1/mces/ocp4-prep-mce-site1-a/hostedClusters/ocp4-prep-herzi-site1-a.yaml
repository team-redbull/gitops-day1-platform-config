dhcp_values:
  scopeName: "ocp4-prep-herzi-site1-a"
  network: "10.20.40.0"
  startRange: "10.20.40.11"
  endRange: "10.20.40.240"

  exclusions:
    - startAddress: "10.20.40.1"
      endAddress: "10.20.40.10"
    - startAddress: "10.20.40.241"
      endAddress: "10.20.40.254"

  # Opt in to the failover settings from sites/configValues.yaml, with no
  # per-cluster overrides. relationshipName is omitted on purpose — it derives
  # <scopeName>-failover.
  #
  # `{}` and not a bare `failover:`. A bare key is YAML null, and null *removes*
  # the inherited block rather than accepting it; `{}` deep-merges and keeps it.
  failover: {}