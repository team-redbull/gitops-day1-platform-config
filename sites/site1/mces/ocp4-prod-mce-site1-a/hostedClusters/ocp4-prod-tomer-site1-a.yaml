dhcp_values:
  # scopeName omitted: derives from this file's name.
  # subnetMask and gateway omitted: derive 255.255.255.0 and .254.
  network: "10.20.41.0"
  # A mixed range change from .11-.240: the start moves out while the end moves in.
  # Windows refuses that in one call (DHCP 20023), so it has to widen to the union
  # .5-.240 first and then narrow to .5-.200.
  startRange: "10.20.41.5"
  endRange: "10.20.41.200"

  # Options 66/67. Both keys or neither — half a pair is refused by the API and CI.
  pxe:
    server: "boot.site1.lab.local"
    # Changed, not cleared: a diff that wrongly concludes "unchanged" issues no cmdlet,
    # returns 200 and leaves the server stale, which a clear-to-default test cannot catch.
    bootfile: "ipxe.efi"

  exclusions:
    - startAddress: "10.20.41.1"
      endAddress: "10.20.41.4"

  # No failover key: the whole block is inherited from sites/configValues.yaml and
  # relationshipName derives <scopeName>-failover.

mastertag: 4.16.27-x86_84